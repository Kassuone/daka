<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>黑曜石考勤系统 PRO</title>
    <style>
        :root {
            --gold-1: #FFD700;
            --gold-2: #D4AF37;
            --gold-3: #B8860B;
            --bg-1: #0A0A0A;
            --bg-2: #1A1A1A;
            --bg-3: #2A2A2A;
            --danger: #ff4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'HarmonyOS Sans', 'Microsoft YaHei', sans-serif;
        }

        body {
            background: var(--bg-1);
            color: var(--gold-1);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .particles {
            position: fixed;
            width: 100vw;
            height: 100vh;
            z-index: -1;
        }

        .particle {
            position: absolute;
            background: radial-gradient(circle, var(--gold-1) 0%, transparent 70%);
            opacity: 0.1;
            animation: float 20s infinite linear;
        }

        @keyframes float {
            0% { transform: translateY(0) translateX(0); }
            25% { transform: translateY(-20vh) translateX(10vw); }
            50% { transform: translateY(10vh) translateX(-10vw); }
            75% { transform: translateY(-30vh) translateX(15vw); }
            100% { transform: translateY(0) translateX(0); }
        }

        .header {
            text-align: center;
            padding: 3rem;
            background: linear-gradient(45deg, var(--bg-2) 0%, var(--bg-3) 100%);
            border-radius: 20px;
            margin-bottom: 3rem;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .header::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(transparent 0deg, var(--gold-1) 180deg, transparent 360deg);
            animation: rotate 20s linear infinite;
            opacity: 0.1;
        }

        @keyframes rotate {
            100% { transform: rotate(360deg); }
        }

        .clock {
            font-size: 3em;
            letter-spacing: 4px;
            text-shadow: 0 0 20px var(--gold-1);
            background: linear-gradient(45deg, var(--gold-1), var(--gold-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            position: relative;
            z-index: 1;
        }

        .punch-btn {
            background: linear-gradient(145deg, var(--gold-1) 0%, var(--gold-2) 50%, var(--gold-3) 100%);
            border: none;
            padding: 1.5rem 4rem;
            font-size: 1.5em;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
            overflow: hidden;
            margin: 3rem 0;
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.3);
            color: var(--bg-1);
        }

        .punch-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: 0.5s;
        }

        .punch-btn:hover {
            transform: scale(1.05) rotate(2deg);
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.5);
        }

        .user-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1.5rem;
            margin: 3rem 0;
        }

        .user-card {
            background: var(--bg-2);
            padding: 2rem;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease-out;
            position: relative;
            border: 1px solid transparent;
            background-clip: padding-box;
        }

        .user-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 15px;
            padding: 2px;
            background: linear-gradient(45deg, var(--gold-1), transparent 30%, var(--gold-3));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask-composite: exclude;
            opacity: 0.5;
        }

        .user-card:hover {
            transform: translateY(-5px) perspective(1000px) rotateX(5deg);
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
        }

        .delete-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: var(--danger);
            border: none;
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .delete-btn:hover {
            transform: scale(1.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 3rem 0;
            background: var(--bg-2);
            border-radius: 15px;
            overflow: hidden;
        }

        th, td {
            padding: 1.2rem;
            text-align: center;
            position: relative;
        }

        th {
            background: linear-gradient(45deg, var(--bg-3), var(--bg-2));
            font-weight: 600;
            letter-spacing: 1px;
        }

        tr:nth-child(even) {
            background: rgba(255,215,0,0.03);
        }

        tr:hover {
            background: rgba(255,215,0,0.05);
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(10px);
            z-index: 1000;
        }

        .modal-content {
            background: var(--bg-2);
            padding: 3rem;
            border-radius: 20px;
            width: 90%;
            max-width: 500px;
            border: 1px solid var(--gold-1);
            position: relative;
            transform: scale(0.9);
            opacity: 0;
            animation: modalEnter 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes modalEnter {
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .time-input {
            display: flex;
            gap: 1rem;
            margin: 2rem 0;
            align-items: center;
        }

        input[type="time"] {
            background: var(--bg-3);
            border: 1px solid var(--gold-1);
            color: var(--gold-1);
            padding: 1rem;
            border-radius: 10px;
            width: 100%;
            font-size: 1.2em;
            transition: all 0.3s;
        }

        .gold-btn {
            background: linear-gradient(45deg, var(--gold-2), var(--gold-1));
            border: none;
            padding: 1rem 2rem;
            border-radius: 8px;
            color: var(--bg-1);
            cursor: pointer;
            transition: transform 0.3s;
            margin: 0.5rem;
        }

        .danger-btn {
            background: linear-gradient(45deg, #ff4444, #cc0000) !important;
        }

        .gold-btn:hover {
            transform: scale(1.05);
        }

        #salaryResult {
            margin: 3rem 0;
            padding: 2rem;
            background: var(--bg-2);
            border-radius: 15px;
            text-align: center;
            font-size: 1.5em;
        }

        .salary-detail {
            margin-top: 1rem;
            padding: 1rem;
            background: var(--bg-3);
            border-radius: 10px;
            text-align: left;
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-3);
            color: var(--gold-1);
            padding: 1rem 2rem;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { bottom: -50px; opacity: 0; }
            to { bottom: 2rem; opacity: 1; }
        }

        .toolbar {
            margin: 2rem 0;
            text-align: right;
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>

    <div class="container">
        <div class="header">
            <div class="clock" id="datetime"></div>
            <button class="punch-btn" onclick="showUserList()">🕒 立即打卡</button>
        </div>

        <div class="toolbar">
            <button onclick="addUser()" class="gold-btn">➕ 添加用户</button>
            <button onclick="initializeData()" class="gold-btn danger-btn">🔄 初始化数据</button>
        </div>

        <div id="userList" class="user-list"></div>

        <h2 class="section-title">📜 考勤记录</h2>
        <table id="historyTable">
            <thead>
                <tr>
                    <th>📅 日期</th>
                    <th>👤 姓名</th>
                    <th>⏳ 工作时间</th>
                    <th>🕒 时长</th>
                    <th>💰 金额</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <div class="salary-section">
            <button onclick="showUserSelection()" class="gold-btn">💸 结算用户工资</button>
            <div id="salaryResult"></div>
        </div>
    </div>

    <!-- 时间选择模态框 -->
    <div id="timeModal" class="modal">
        <div class="modal-content">
            <h3>⏰ 选择工作时间</h3>
            <div class="time-input">
                <input type="time" id="startTime" required>
                <span style="color: var(--gold-1);">➔</span>
                <input type="time" id="endTime" required>
            </div>
            <div class="modal-actions">
                <button onclick="saveRecord()" class="gold-btn">✅ 保存记录</button>
                <button onclick="closeModal()" class="gold-btn">❌ 取消</button>
            </div>
        </div>
    </div>

    <!-- 工资用户选择模态框 -->
    <div id="salaryUserModal" class="modal">
        <div class="modal-content">
            <h3>🔍 选择结算用户</h3>
            <div id="salaryUserList" class="user-list"></div>
            <button onclick="closeSalaryModal()" class="gold-btn">❌ 取消</button>
        </div>
    </div>

    <script>
        // 初始化数据
        let users = JSON.parse(localStorage.getItem('users')) || ['韩玲', '阿迎'];
        let records = JSON.parse(localStorage.getItem('records')) || [];
        let currentUser = null;

        // 实时时钟
        function updateDateTime() {
            const now = new Date();
            document.getElementById('datetime').textContent = now.toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            });
        }
        setInterval(updateDateTime, 1000);
        updateDateTime();

        // 粒子背景
        function createParticles() {
            const container = document.getElementById('particles');
            for(let i=0; i<50; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.width = Math.random()*4+2 + 'px';
                particle.style.height = particle.style.width;
                particle.style.left = Math.random()*100 + '%';
                particle.style.top = Math.random()*100 + '%';
                particle.style.animationDelay = Math.random()*20 + 's';
                container.appendChild(particle);
            }
        }
        createParticles();

        // 用户管理
        function renderUsers() {
            const container = document.getElementById('userList');
            container.innerHTML = users.map(user => `
                <div class="user-card" onclick="selectUser('${user}')">
                    ${user}
                    <button class="delete-btn" onclick="event.stopPropagation(); deleteUser('${user}')">×</button>
                </div>
            `).join('');
        }

        function addUser() {
            const name = prompt('请输入新用户姓名:');
            if (name && !users.includes(name)) {
                users.push(name);
                localStorage.setItem('users', JSON.stringify(users));
                renderUsers();
                showToast('用户添加成功 ✔');
            }
        }

        function deleteUser(name) {
            if (confirm(`确定要删除用户 ${name} 吗？`)) {
                users = users.filter(u => u !== name);
                localStorage.setItem('users', JSON.stringify(users));
                renderUsers();
                showToast('用户已删除 ✖');
            }
        }

        // 打卡功能
        function selectUser(name) {
            currentUser = name;
            document.getElementById('timeModal').style.display = 'flex';
        }

        function saveRecord() {
            const start = document.getElementById('startTime').value;
            const end = document.getElementById('endTime').value;

            if (!start || !end) {
                showToast('请选择完整时间段 ❗');
                return;
            }

            const startDate = new Date(`2000-01-01T${start}`);
            const endDate = new Date(start < end ? `2000-01-01T${end}` : `2000-01-02T${end}`);
            const diffMs = endDate - startDate;
            const hours = (diffMs / 3600000).toFixed(2);

            records.push({
                date: calculateRecordDate(end),
                user: currentUser,
                start,
                end,
                hours,
                amount: hours * 50
            });

            localStorage.setItem('records', JSON.stringify(records));
            closeModal();
            renderHistory();
            showToast('记录保存成功 ✔');
        }

        function calculateRecordDate(endTime) {
            const now = new Date();
            const [hours] = endTime.split(':').map(Number);
            if (hours < 6) now.setDate(now.getDate() - 1);
            return now.toISOString().split('T')[0];
        }

        // 历史记录
        function renderHistory() {
            const tbody = document.querySelector('#historyTable tbody');
            tbody.innerHTML = records.map(record => `
                <tr>
                    <td>${record.date}</td>
                    <td>${record.user}</td>
                    <td>${record.start} ➔ ${record.end}</td>
                    <td>${record.hours} 小时</td>
                    <td>¥${record.amount.toFixed(2)}</td>
                </tr>
            `).join('');
        }

        // 工资计算
        function showUserSelection() {
            const container = document.getElementById('salaryUserList');
            container.innerHTML = users.map(user => `
                <div class="user-card" onclick="calculateSalary('${user}')">
                    ${user}
                </div>
            `).join('');
            document.getElementById('salaryUserModal').style.display = 'flex';
        }

        function calculateSalary(user) {
            const currentMonth = new Date().getMonth();
            const userRecords = records.filter(r =>
                new Date(r.date).getMonth() === currentMonth &&
                r.user === user
            );

            const total = userRecords.reduce((sum, r) => sum + r.amount, 0);
            const detail = userRecords.map(r => `
                <div class="salary-detail">
                    📅 ${r.date} ⏰ ${r.start}-${r.end}
                    (🕒 ${r.hours}小时) 💰 ¥${r.amount.toFixed(2)}
                </div>
            `).join('');

            document.getElementById('salaryResult').innerHTML = `
                <h3>${user} 本月工资明细</h3>
                <div>💰 总金额：¥${total.toFixed(2)}</div>
                ${detail}
            `;
            closeSalaryModal();
        }

        // 系统初始化
        function initializeData() {
            if(confirm("确定要初始化所有数据吗？此操作不可恢复！")) {
                localStorage.clear();
                users = ['韩玲', '阿迎'];
                records = [];
                localStorage.setItem('users', JSON.stringify(users));
                renderUsers();
                renderHistory();
                showToast('系统已重置 ✔');
            }
        }

        // 工具函数
        function closeModal() {
            document.getElementById('timeModal').style.display = 'none';
            document.getElementById('startTime').value = '';
            document.getElementById('endTime').value = '';
        }

        function closeSalaryModal() {
            document.getElementById('salaryUserModal').style.display = 'none';
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }

        // 初始化
        renderUsers();
        renderHistory();
    </script>
</body>
</html>
